schema = 1

# Canonical language catalog. Status lives here; moderation support does not.
#
# A language is supported for moderation exactly when processor/service/rules/<code>.yml
# exists. This file records what we are willing to say about each code: whether Cloud
# may offer it, which model it rides on, whether a pack exists, and whether anyone has
# actually measured accuracy. It is not a promise that the speech model "supports 100
# languages", and `auto` is not a language, so it must never appear here.
#
# rule_pack: none | draft | reviewed | verified
# evidence:  unmeasured | pilot | verified
# cloud_base: only English is true in the first cloud plan.
# cloud_selectable: true only for verified moderation packs in this first release.
#
# Measured WER exists for English (5.83%) and Czech (10.19%) on the Opus-path corpus
# in docs/stt-model-selection.md. Those two numbers must not be copied onto the other
# twenty-one packs. Production quality model: parakeet-tdt-0.6b-v3-fp32.

[[languages]]
code = "bg"
name = "Bulgarian"
cloud_base = false
cloud_selectable = true
models = ["parakeet-tdt-0.6b-v3-fp32"]
rule_pack = "verified"
evidence = "unmeasured"

