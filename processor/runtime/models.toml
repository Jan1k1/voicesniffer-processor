# The fp32 export of the *same checkpoint* as the int8 entry above. Measured on
# a 520-utterance Common Voice corpus pushed through the real Opus path, it
# takes English WER from 28.1% to 5.8% and Czech from 25.7% to 10.2%, and the
# int8 build's habit of returning an empty transcript for one English utterance
# in five (52/260) drops to 1/260. See docs/stt-model-selection.md.
#
# Fetched as loose files rather than an archive because upstream publishes no
# tarball for it, and it cannot be re-published as one either: the archive is
# 2.21 GiB, over GitHub's 2 GiB per-asset ceiling, and xz only reaches ~2.19 GiB.
# The URL names an immutable git revision of the same publisher's repository as
# the int8 build, and every file carries its own SHA-256 -- including
# `encoder.weights`, the 2.4 GB of ONNX external data that the archive form
# could not have verified because `files` only names the four loader roles.
# Digests were computed from the downloaded bytes and independently cross-checked
# against Hugging Face's own LFS object ids for that revision.
[[models]]
id = "parakeet-tdt-0.6b-v3-fp32"
family = "nemo-transducer"
base_url = "https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3/resolve/1a468a35cbba69418f126de829e75261dea4a4e4"
