# Declared as the same 25 as Parakeet, which under-claims: Whisper's tokenizer
# carries 99 languages and it takes an explicit `language` argument, unlike the
# transducer branch. That matters if Turkish is ever wanted, because this is the
# only shipped model that can do it -- at 13.5% English and 45.2% Czech word
# error against Parakeet fp32's 5.8% and 10.2%, so not as a replacement. Adding
# a language here also needs it in model_store._LANGUAGES.
[[models]]
id = "whisper-small-multilingual-int8"
family = "whisper"
