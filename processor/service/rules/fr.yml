  # The same approach where it is still ambiguous, plus the phrase a Minecraft
  # player uses about armour: "tu es nu" means "you have no armour on".
  - id: fr.sexual.grooming-signal
    term: tu es seul chez toi
    category: sexual
    severity: 3
    match: exact
    variants:
      - t es seul chez toi
      - tu es seule chez toi
      - t es seule chez toi
