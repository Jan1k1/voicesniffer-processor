  # The highest-value rules in this pack for a Minecraft audience. Age is not
  # something the product can know, so these are phrased to catch the approach
  # rather than the age: isolation, secrecy, moving off-platform, images.
  - id: fr.sexual.grooming
    term: ne le dis pas à tes parents
    category: sexual
    severity: 3
    match: exact
    variants:
      - ne le dis pas a tes parents
      - le dis pas à tes parents
      - le dis pas a tes parents
      - ne dis rien à tes parents
      - ne dis rien a tes parents
      - ne le dis à personne
      - ne le dis a personne
      - le dis à personne
      - le dis a personne
      - c est notre petit secret
      - c est notre secret
      - ça reste entre nous
      - ca reste entre nous
      - enlève tes vêtements
      - enleve tes vetements
      - déshabille toi
      - deshabille toi
      - enlève ton pantalon
      - enleve ton pantalon
