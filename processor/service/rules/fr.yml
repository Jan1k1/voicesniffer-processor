      - je veux te niquer
      - montre moi tes seins
      - montre moi tes nichons
      - montre moi ton cul
      - montre moi ta chatte
      - envoie des nudes
      - envoie moi des nudes
      - envoie moi une photo nue
      - envoie moi des photos nues
      - branle moi
