  # The same approach where it is still ambiguous, plus the two phrases a
  # Minecraft player uses about armour: "are you naked" means "are you wearing
  # armour" on any survival server, and it was severity 3 here. Review tier --
  # a moderator reading three of these from one account has what they need.
  - id: en.sexual.grooming-signal
    term: are you home alone
    category: sexual
    severity: 3
